name: release

# Bouwt een Windows-.exe en hangt hem aan een GitHub Release.
# Trigger: push een tag zoals `v2.0.0`, of start handmatig (workflow_dispatch).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller imageio-ffmpeg pytest pyflakes

      - name: Quality gate (lint + unit tests)
        run: |
          python -m pyflakes sample_finder.py
          python -m pytest tests/ -q

      - name: Bundle ffmpeg (via imageio-ffmpeg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          $src = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          Copy-Item $src ffmpeg/ffmpeg.exe -Force
          Write-Host "ffmpeg -> ffmpeg/ffmpeg.exe"

      - name: Build exe
        run: pyinstaller --noconfirm SampleFinder.spec

      - name: Smoke test (frozen binary)
        shell: pwsh
        run: |
          dist\SampleFinder.exe analyze --help
          python -c "import numpy as np, soundfile as sf; sf.write('smoke.wav', (0.05*np.random.randn(44100*3,2)).astype('float32'), 44100)"
          dist\SampleFinder.exe analyze smoke.wav --out-dir smoke_out --beat-backend librosa
          dist\SampleFinder.exe export smoke.wav --out-dir smoke_out --format wav

      - name: Rename artifact with version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF -replace "refs/tags/","" } else { "dev" }
          Copy-Item dist/SampleFinder.exe "SampleFinder-$tag-win64.exe"
          echo "ASSET=SampleFinder-$tag-win64.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
